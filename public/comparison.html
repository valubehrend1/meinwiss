<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comparación Chat vs Widget</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        line-height: 1.6;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      h1 {
        color: #333;
        text-align: center;
      }

      .comparison {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 30px;
      }

      .section {
        flex: 1;
        min-width: 300px;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 15px;
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
      }

      h2 {
        margin-top: 0;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
      }

      .iframe-container {
        width: 100%;
        height: 600px;
        border: none;
      }

      .widget-container {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 350px;
        height: 500px;
        border: none;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        z-index: 1000;
      }

      .widget-minimized {
        height: 50px;
      }

      .controls {
        margin-top: 15px;
        display: flex;
        gap: 10px;
      }

      button {
        padding: 8px 15px;
        background-color: #00301e;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        background-color: #004c32;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Comparación Chat vs Widget</h1>

      <div class="comparison">
        <div class="section">
          <h2>Chat Principal</h2>
          <p>
            Esta es la versión completa del chat dentro de la aplicación
            principal.
          </p>
          <iframe
            src="http://localhost:5173/chat"
            class="iframe-container"
            title="Chat Principal"
          ></iframe>
        </div>

        <div class="section">
          <h2>Chat Widget (IFrame)</h2>
          <p>
            Esta es la versión del chat como widget para integrar en páginas
            externas.
          </p>
          <div class="controls">
            <button id="minimizeWidget">Minimizar Widget</button>
            <button id="maximizeWidget">Maximizar Widget</button>
            <button id="resetWidget">Reiniciar Chat</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Widget de chat (iframe) -->
    <iframe
      id="chatWidget"
      src="http://localhost:5173/widget"
      class="widget-container"
      title="Chat Widget"
    >
    </iframe>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const chatWidget = document.getElementById('chatWidget');

        // Escuchar mensajes del iframe
        window.addEventListener('message', function (event) {
          if (event.origin !== 'http://localhost:5173') return;

          if (event.data.type === 'CHAT_WIDGET_TOGGLE') {
            if (event.data.isMinimized) {
              chatWidget.classList.add('widget-minimized');
            } else {
              chatWidget.classList.remove('widget-minimized');
            }
          }
        });

        // Controles del widget
        document
          .getElementById('minimizeWidget')
          .addEventListener('click', function () {
            chatWidget.contentWindow.postMessage(
              {
                type: 'PARENT_COMMAND',
                command: 'minimize',
              },
              '*'
            );
            chatWidget.classList.add('widget-minimized');
          });

        document
          .getElementById('maximizeWidget')
          .addEventListener('click', function () {
            chatWidget.contentWindow.postMessage(
              {
                type: 'PARENT_COMMAND',
                command: 'maximize',
              },
              '*'
            );
            chatWidget.classList.remove('widget-minimized');
          });

        document
          .getElementById('resetWidget')
          .addEventListener('click', function () {
            chatWidget.contentWindow.postMessage(
              {
                type: 'PARENT_COMMAND',
                command: 'reset',
              },
              '*'
            );
          });
      });
    </script>
  </body>
</html>
